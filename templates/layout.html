<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "NovaMart" }}</title>
  <style>
    :root{
      --bg:#0b0f19; --card:#0f172a; --muted:#94a3b8; --text:#e2e8f0;
      --line:#1f2a44; --brand:#7c3aed; --brand2:#22c55e; --danger:#ef4444;
      --shadow: 0 20px 40px rgba(0,0,0,.35);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(124,58,237,.35), transparent 60%),
                  radial-gradient(900px 500px at 90% 0%, rgba(34,197,94,.20), transparent 60%),
                  var(--bg);
      color:var(--text);
    }
    a{color:inherit; text-decoration:none}
    .wrap{max-width:1100px; margin:0 auto; padding:22px}
    .nav{
      position:sticky; top:0; z-index:20;
      backdrop-filter: blur(10px);
      background: rgba(11,15,25,.65);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .nav-inner{display:flex; align-items:center; gap:14px; padding:14px 22px; max-width:1100px; margin:0 auto;}
    .logo{
      display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.2px;
    }
    .dot{width:10px;height:10px;border-radius:99px;background:linear-gradient(135deg,var(--brand),var(--brand2))}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:999px;
      border:1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.04);
      color:var(--muted); font-size:14px;
    }
    .pill:hover{background: rgba(255,255,255,.07); color:var(--text)}
    .spacer{flex:1}
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:10px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05); color:var(--text); cursor:pointer;
      font-weight:600; font-size:14px;
      transition:.15s ease;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.08)}
    .btn-primary{
      border:none; background: linear-gradient(135deg, var(--brand), #4f46e5);
      box-shadow: 0 12px 26px rgba(124,58,237,.25);
    }
    .btn-primary:hover{filter: brightness(1.05)}
    .btn-danger{border:none; background: rgba(239,68,68,.15); color:#fecaca}
    .btn-danger:hover{background: rgba(239,68,68,.22)}
    .card{
      background: rgba(15,23,42,.72);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card-pad{padding:18px}
    .h1{font-size:28px; font-weight:800; margin:0}
    .sub{margin:8px 0 0; color:var(--muted); font-size:14px}
    .grid{display:grid; gap:16px}
    .grid-3{grid-template-columns: repeat(3, minmax(0, 1fr));}
    @media (max-width: 950px){ .grid-3{grid-template-columns: repeat(2, 1fr);} }
    @media (max-width: 640px){ .grid-3{grid-template-columns: 1fr;} .wrap{padding:16px} }
    .input{
      width:100%; padding:12px 14px; border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05); color:var(--text);
      outline:none;
    }
    .input:focus{border-color: rgba(124,58,237,.6); box-shadow: 0 0 0 4px rgba(124,58,237,.18)}
    .flash{margin-top:14px; padding:12px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.10); color:var(--text)}
    .flash.ok{background: rgba(34,197,94,.12)}
    .flash.error{background: rgba(239,68,68,.12)}
    .badge{
      display:inline-flex; align-items:center; padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.10); color:var(--muted); font-size:12px;
    }
    .price{font-weight:800}
    .muted{color:var(--muted)}
    .footer{padding:18px 22px; color:var(--muted); font-size:13px; border-top:1px solid rgba(255,255,255,.08)}
  </style>
</head>
<body>
  <div class="nav">
    <div class="nav-inner">
      <a class="logo" href="{{ url_for('products') }}">
        <span class="dot"></span>
        <span>NovaMart</span>
      </a>

      <a class="pill" href="{{ url_for('products') }}">Products</a>
      <a class="pill" href="{{ url_for('cart') }}">Cart</a>

      <div class="spacer"></div>

      {% if current_user.is_authenticated %}
        <span class="badge">Hi, {{ current_user.name }}</span>
        <a class="btn" href="{{ url_for('orders') }}">Orders</a>
        <a class="btn btn-danger" href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a class="btn btn-primary" href="{{ url_for('auth', mode='login') }}">Sign in</a>
      {% endif %}
    </div>
  </div>

  <div class="wrap">
    {% block content %}{% endblock %}
  </div>

  <div class="footer wrap">
    Built by Abijith — QA + End-to-End Testing Showcase
  </div>
</body>
</html>
