{% extends "layout.html" %}
{% block content %}
  <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:14px; margin-bottom:16px;">
    <div>
      <h1 class="h1">Products</h1>
      <p class="sub">Premium UI • Add to cart • Checkout • Orders</p>
    </div>

    <form method="GET" action="{{ url_for('products') }}" style="min-width:280px;">
      <input class="input" name="q" value="{{ q or '' }}" placeholder="Search products..." />
    </form>
  </div>

  <div class="grid grid-3">
    {% for p in products %}
      <div class="card" style="overflow:hidden;">
        <div style="height:170px; background:#0b1222;">
          <img src="{{ p.image_url }}" alt="{{ p.name }}" style="width:100%; height:170px; object-fit:cover; display:block; opacity:.95;">
        </div>
        <div class="card-pad">
          <div style="display:flex; justify-content:space-between; gap:12px;">
            <div style="font-weight:800;">{{ p.name }}</div>
            <div class="price">${{ '%.2f'|format(p.price) }}</div>
          </div>
          <div class="sub" style="margin-top:6px;">{{ p.description }}</div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
            <span class="badge">Stock: {{ p.stock }}</span>

            <form method="POST" action="{{ url_for('cart_add') }}">
              <input type="hidden" name="product_id" value="{{ p.id }}">
              <input type="hidden" name="quantity" value="1">
              <button class="btn btn-primary" {% if p.stock <= 0 %}disabled style="opacity:.5; cursor:not-allowed"{% endif %}>
                Add to cart
              </button>
            </form>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
